<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MailFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="icon" type="image/svg+xml+png" href="icons/logo.png"/>
</head>
<body>
  <main id="login-screen" class="landing-shell hidden">
    <section class="hero-section">
      <div class="hero-frame">
        <div class="orbital-field" aria-hidden="true">
          <span class="orbit orbit-one"></span>
          <span class="orbit orbit-two"></span>
          <span class="orbit orbit-three"></span>
          <span class="signal signal-one"></span>
          <span class="signal signal-two"></span>
          <span class="signal signal-three"></span>
        </div>
        <div class="noise-overlay" aria-hidden="true"></div>
        <div class="hero-gradient" aria-hidden="true"></div>


        <div class="hero-content">
          <div class="hero-title-wrap reveal-words" data-text="MailFlow" data-asterisk="true"></div>
          <div class="hero-copy">
            <p>MailFlow gives Gmail outreach teams one place to launch sequences, draft with AI, and take over replies when a human touch matters.</p>
            <a class="cta-button" href="/auth/google">
              Connect Gmail
              <span aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
              </span>
            </a>
          </div>
        </div>
      </div>
    </section>
  <div class="toast" id="toast"></div>
  <script src="/js/app.js"></script>
</body>
</html>
